services:
  backend:
    build: ./backend
    container_name: webowo-backend
    restart: unless-stopped
    ports:
      - "6666:3000"
    env_file:
      - .env
    volumes:
      - webowo-data:/app/data
    networks:
      - webowo-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    container_name: webowo-frontend
    restart: unless-stopped
    ports:
      - "7777:80"
    depends_on:
      - backend
    networks:
      - webowo-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  webowo-data:

networks:
  webowo-net:
    driver: bridge
