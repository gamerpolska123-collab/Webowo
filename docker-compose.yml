# ============================================
# Webowo v3.1 – Docker Compose
# ============================================

services:
  backend:
    build: ./backend
    container_name: webowo-backend
    restart: unless-stopped
    ports:
      - "6666:3000"
    volumes:
      - webowo-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/db/webowo.sqlite
      - UPLOAD_DIR=/app/data/uploads
      - CMS_BACKUP_DIR=/app/data/backups
      - LOG_DIR=/app/data/logs
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://www.matys.net.pl}
      - SITE_URL=${SITE_URL:-https://www.matys.net.pl}
    networks:
      - webowo-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: webowo-frontend
    restart: unless-stopped
    ports:
      - "7777:80"
    depends_on:
      - backend
    networks:
      - webowo-net

volumes:
  webowo-data:
    driver: local

networks:
  webowo-net:
    driver: bridge
